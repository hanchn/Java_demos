<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Demos - 学习示例项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        .logo {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .api-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .api-title {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .api-link {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
            transition: background 0.3s;
        }
        
        .api-link:hover {
            background: #0056b3;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .info-card {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
        }
        
        .info-card h3 {
            color: #495057;
            margin-bottom: 10px;
        }
        
        .info-card p {
            color: #6c757d;
            line-height: 1.5;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">☕</div>
        <h1>Java Demos</h1>
        <p class="subtitle">Java学习示例项目集合</p>
        
        <div class="api-section">
            <h3 class="api-title">🚀 API接口测试</h3>
            <a href="/api/hello" class="api-link" target="_blank">Hello API</a>
            <a href="/api/hello/JavaLearner" class="api-link" target="_blank">Hello with Name</a>
            <a href="/api/info" class="api-link" target="_blank">App Info</a>
            <a href="/h2-console" class="api-link" target="_blank">H2 Database</a>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>🎯 学习目标</h3>
                <p>通过实际项目学习Java和Spring Boot开发技能</p>
            </div>
            <div class="info-card">
                <h3>🛠️ 技术栈</h3>
                <p>Java 17, Spring Boot 3.2, Maven, H2 Database</p>
            </div>
            <div class="info-card">
                <h3>📚 示例内容</h3>
                <p>基础语法、OOP、集合、多线程、Web开发等</p>
            </div>
            <div class="info-card">
                <h3>🔧 开发工具</h3>
                <p>支持热重载、自动重启、开发者工具</p>
            </div>
        </div>
        
        <div class="footer">
            <p>🌟 Ready for your Java learning journey!</p>
            <p>访问上面的API链接开始探索</p>
        </div>
    </div>
</body>
</html>
