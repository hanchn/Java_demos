# 测试环境配置文件
spring:
  application:
    name: java-demos-test
  
  # 测试数据源配置
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA测试配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  # H2控制台在测试环境中禁用
  h2:
    console:
      enabled: false

# 测试服务器配置
server:
  port: 0  # 随机端口

# 测试日志配置
logging:
  level:
    com.example.javademos: INFO
    org.springframework: WARN
    org.hibernate: WARN